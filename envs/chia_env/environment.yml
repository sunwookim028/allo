# Generated 2026-10-31 from the live env (conda env export --from-history + conda list).
# Create: conda env create -f envs/chia_env/environment.yml   (from the repo root; see envs/README.md)
name: chia_env
channels:
  - defaults
dependencies:
  - python==3.10.19
  - pip==26.2.1
  # python-visible conda deps, pinned so pip list matches the original
  - setuptools==83.0.0
  - wheel==0.47.0
  - packaging==26.3
  - pip:
      - -r requirements.txt
