# Generated 2026-10-31 from the live env (conda env export --from-history + conda list).
# Create: conda env create -f envs/allo/environment.yml   (from the repo root; see envs/README.md)
name: allo
channels:
  - defaults
dependencies:
  - python==3.12.13
  - numpy==2.5.1
  - pip==26.1.2
  # python-visible conda deps, pinned so pip list matches the original
  - setuptools==83.0.0
  - wheel==0.47.0
  - packaging==26.2
  - mkl-service==2.7.2
  - mkl_fft==2.2.0
  - mkl_random==1.4.1
  - pip:
      - -r requirements.txt
variables:
  LLVM_BUILD_DIR: /home/sk3463/tools/llvm-allo/build   # ace-01: sunwookim028/llvm-allo (fetch.sh && build.sh)
# Other hosts: conda applies the value above verbatim (no $HOME expansion). After creating
# the env, set the host's value once:
#   zhang-21: conda env config vars set -n allo LLVM_BUILD_DIR=/work/shared/common/llvm-project-main/build-rhel8
