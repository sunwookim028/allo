[build-system]
requires = ["nanobind>=2.10,<3", "scikit-build-core>=0.10", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "allo"
version = "1.0.0"
dependencies = ["rich", "sympy", "numpy", "ml_dtypes"]
requires-python = ">=3.12"
authors = [{ name = "Allo Authors" }]
description = "Allo: Accelerator Design and Programming Language"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["compiler", "hls", "fpga", "accelerator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "nanobind",
  "pytest",
  "pytest-xdist",
  "cocotb",
  "sccache",
  "clang-format==22.1.8",
  "black==24.8.0",
  "pylint==3.0.2",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
ninja.version = ">=1.10"
cmake.build-type = "Release"
cmake.source-dir = "."
build-dir = "build"
wheel.packages = ["allo"]

[tool.scikit-build.cmake.define]
CMAKE_C_COMPILER = "clang"
CMAKE_CXX_COMPILER = "clang++"
CMAKE_VISIBILITY_INLINES_HIDDEN = "ON"
CMAKE_C_VISIBILITY_PRESET = "hidden"
CMAKE_CXX_VISIBILITY_PRESET = "hidden"
Python_FIND_VIRTUALENV = "ONLY"
Python3_FIND_VIRTUALENV = "ONLY"
LLVM_ENABLE_ZSTD = "OFF"
LLVM_USE_LINKER = "lld"

[tool.scikit-build.editable]
mode = "redirect"
rebuild = false
verbose = false
