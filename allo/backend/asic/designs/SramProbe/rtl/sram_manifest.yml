srams:
  # Probe SRAM for debugging OpenRAM geometry/routing issues. This keeps
  # the same suspicious topology as the tile SRAMs, but is much smaller.
  - name: sram_probe_2rw_128x32_wpr4
    word_size: 32
    num_words: 128
    num_rw_ports: 2
    num_r_ports: 0
    num_w_ports: 0
    num_banks: 1
    words_per_row: 4
    write_size: 32
