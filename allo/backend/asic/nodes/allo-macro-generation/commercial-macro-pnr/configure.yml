name: commercial-macro-pnr

inputs:
  - adk
  - synthesis-batch
  - srams

outputs:
  - pnr-batch
  - pnr-status.json
  - macro-pnr-metrics.json

commands:
  - python batch_pnr.py

parameters:
  enable_gui: False
  core_density_target: 0.70
  antenna_check_policy: report
  useful_skew: True
  useful_skew_ccopt_effort: standard
  cell_padding: 2
  signoff_engine: False
  macro_hold_target_slack: 0.050
  macro_setup_target_slack: 0.050
  postroute_optimization_passes: 2
  stop_after_step: none
  floorplan_mode: auto
  floorplan_aspect_ratio: 1.0
  floorplan_width: ''
  floorplan_height: ''
  process_node: 45
  # Macro signal routing stops here. The batch driver derives a sparse PG mesh
  # on this layer and the layer immediately below it.
  highest_macro_routing_layer: 6
  # Represent actual post-route occupancy on the highest macro routing layer
  # with merged, track-aligned OBS tiles. Lower layers remain fully obstructed.
  top_layer_obs_grid_tracks: 4
  top_layer_obs_pin_grid_tracks: 1
  top_layer_obs_spacing_tracks: 1
  base_layer_idx: 0
  gds_stream_out_units: 10000
  pin_layer_offset: 3
  # North/south edge pins use a vertical-preferred layer.
  pin_vertical_layer_offset: 4
  pin_secondary_layer_offset: 5
  # Minimum center-to-center signal-pin pitch is this multiple of the loaded
  # ADK routing-layer pitch. Secondary-layer use is decided from edge capacity.
  pin_min_pitch_multiplier: 2.0
  # Preserve edge-parallel width and extend pins only inward.
  pin_primary_depth_width_multiplier: 3.0
  pin_other_depth_width_multiplier: 2.0
  pin_primary_fraction: 0.75
  # When an east/west edge carries multiple stream-sized groups, move at
  # least one complete group to the secondary horizontal layer instead of
  # waiting for the primary layer to reach its absolute geometric capacity.
  pin_spread_multiple_stream_groups: True
  pin_stream_group_min_width: 16
  # Keep signal pins away from macro corners, where orthogonal routes and
  # clock access otherwise compete for the same small routing region.
  pin_corner_keepout: 3.0
  edge_mesh_margin: 2.0
  edge_mesh_stripe_width_multiplier: 8
  edge_mesh_stripe_spacing_multiplier: 8
  local_cpus: 4
  postroute_max_local_cpus: 4
  worker_timeout_seconds: 21600
  macro_halo: 2.0
  macro_pg_resource_util: 0.2
  macro_forbidden_space_to_macro: '20,20'
  macro_min_space_to_core: '30,30'
  macro_corner_keepout: '5,5'
  macro_edge_keepout: 30.0
  macro_group_spacing: 20.0
  macro_group_max_depth: 2
  well_tap_cell: WELLTAP_X1
  well_tap_interval: 120
  primary_power_net: VDD
  primary_ground_net: VSS
  power_nets: 'VDD,VNW,VDDPST,POC,VDDCE,VDDPE'
  ground_nets: 'VSS,VPW,VSSPST,VSSE'
  power_pin_names: 'VDD'
  ground_pin_names: 'VSS'
  lvs_exclude_cell_list: 'FILL*,WELLTAP*'
  virtuoso_exclude_cell_list: 'FILL*,WELLTAP*'
  adk_tech_lef: inputs/adk/rtk-tech.lef
  adk_stdcell_lef: inputs/adk/stdcells.lef
  adk_gds_layer_map: inputs/adk/rtk-stream-out.map
  adk_qrc_lef_map: inputs/adk/pdk-qrc-lef.map
  adk_cap_table: inputs/adk/rtk-typical.captable
  adk_typical_lib: inputs/adk/stdcells.lib
  adk_bc_lib: inputs/adk/stdcells-bc.lib
  adk_wc_lib: inputs/adk/stdcells-wc.lib

preconditions:
  - assert File( 'inputs/adk' )
  - assert File( 'inputs/synthesis-batch' )
  - |
    import json
    from pathlib import Path
    entries = json.loads(Path('inputs/synthesis-batch/index.json').read_text()).get('entries', [])
    assert not entries or Tool( 'innovus' )

postconditions:
  - assert File( 'outputs/pnr-batch' )
  - assert File( 'outputs/pnr-status.json' )
  - assert File( 'outputs/macro-pnr-metrics.json' )
