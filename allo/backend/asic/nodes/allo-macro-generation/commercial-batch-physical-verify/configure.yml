name: commercial-batch-physical-verify

inputs:
  - adk
  - pnr-batch
  - srams

outputs:
  - verified-pnr-batch
  - physical-verify-status.json
  - macro-physical-verify-metrics.json

commands:
  - python batch_physical_verify.py

parameters:
  drc_nthreads: 4
  drc_rule_deck: calibre-drc-block.rule
  drc_env_setup: undefined
  lvs_nthreads: 4
  lvs_power_name: VDD
  lvs_ground_name: VSS
  lvs_hcells_file: ''
  lvs_connect_names: ''
  lvs_verify_netlist: 1
  lvs_extra_spice_include: ''

preconditions:
  - assert File( 'inputs/adk' )
  - assert File( 'inputs/pnr-batch' )
  - |
    import json
    from pathlib import Path
    entries = json.loads(Path('inputs/pnr-batch/index.json').read_text()).get('entries', [])
    assert not entries or Tool( 'calibre' )

postconditions:
  - assert File( 'outputs/verified-pnr-batch' )
  - assert File( 'outputs/physical-verify-status.json' )
  - assert File( 'outputs/macro-physical-verify-metrics.json' )
