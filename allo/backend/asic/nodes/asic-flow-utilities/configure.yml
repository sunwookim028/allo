name: asic-flow-utilities

inputs: []

outputs:
  - cleanup-node.py
  - run-commercial-simulation.py
  - resolve-sram-contract.py
  - constraints.tcl

commands:
  - mkdir -p outputs
  - cp cleanup_node.py outputs/cleanup-node.py
  - cp run_commercial_simulation.py outputs/run-commercial-simulation.py
  - cp resolve_sram_contract.py outputs/resolve-sram-contract.py
  - python3 generate_constraints.py

parameters:
  construct_path: undefined
  design_name: undefined
  clock_period: 1.0
  clock_port: clk
  clock_name: ideal_clock
  constraints_file: ""
  input_delay_fraction: 0.5
  output_delay_fraction: 0.0
  max_transition_fraction: 0.25
  max_fanout: 20
  clock_uncertainty: 0.0

preconditions:
  - assert File( 'cleanup_node.py' )
  - assert File( 'run_commercial_simulation.py' )
  - assert File( 'resolve_sram_contract.py' )
  - assert File( 'generate_constraints.py' )

postconditions:
  - assert File( 'outputs/cleanup-node.py' )
  - assert File( 'outputs/run-commercial-simulation.py' )
  - assert File( 'outputs/resolve-sram-contract.py' )
  - assert File( 'outputs/constraints.tcl' )
  - assert 'create_clock' in File( 'outputs/constraints.tcl' )
