#=========================================================================
# Synopsys PrimePower -- Gate-Level Power Estimation
#=========================================================================
# This step runs gate-level average power analysis with Synopsys PrimeTime PX
# or PrimePower, the successor of the PrimeTime PX feature
#
# Both average and time-base power analysis can be done
# Either gate-level or rtl switching activities can be used
# Optional hardened-macro DBs are discovered under macro-registry/*/*.db.
#
# Author : Maximilian Koschay
# Date   : 05.03.2021
#

name: synopsys-pt-power

#-------------------------------------------------------------------------
# Inputs and Outputs
#-------------------------------------------------------------------------

inputs:
  - adk
  - design.vcs.v
  - design.pt.sdc
  - design.spef.gz
  - run.saif
  - run.vcd
  - design.namemap
  - macro-registry
  - srams
  - testbench-contract.json

outputs:
  - primetime.session
  - design.sdf
  - power-reports
  - power.rpt
  - activity.rpt
  - activity-source.json

#-------------------------------------------------------------------------
# Commands
#-------------------------------------------------------------------------

commands:
  - python3 prepare_activity.py
  - python3 prepare_pt_sdc.py inputs/design.pt.sdc prepared-design.pt.sdc
  - source run.sh
  - cp activity-source.json outputs/activity-source.json
  - cp -a reports outputs/power-reports
  - ln -sf ../reports/$design_name.power.rpt outputs/power.rpt
  - ln -sf ../reports/$design_name.activity.post.rpt outputs/activity.rpt

debug:
  - source debug.sh

#-------------------------------------------------------------------------
# Parameters
#-------------------------------------------------------------------------

parameters:
  design_name: undefined
  # auto derives <testbench_top>/<dut_instance> from testbench-contract.json.
  # An explicit value remains supported for legacy or unusual hierarchies.
  saif_instance: auto
  # bagl_vcd, ffgl_vcd, rtl_vcd, or saif. Selection is explicit; the node no
  # longer chooses an activity source merely because a file happens to exist.
  activity_source: bagl_vcd
  # analysis mode either "averaged" or "time_based"
  analysis_mode: averaged
  # Set library operating condition to be used for timing and power estimation
  # Leaving it undefined PrimeTime will choose the operating condition of the first target library in the list
  # eg. the Operating condition of the FreePDK45 ADK can be set "typical"
  lib_op_condition: undefined
  # Order of script execution
  order:
    - designer-interface.tcl
    - setup-session.tcl
    - read-design.tcl
    - report-timing.tcl
    - report-power.tcl

preconditions:
  - assert Tool( 'pt_shell' )
  - assert Tool( 'python3' )
  - assert File( 'prepare_activity.py' )
  - assert File( 'inputs/adk' )
  - assert File( 'inputs/design.vcs.v' )
  - assert File( 'inputs/design.pt.sdc' )
  - assert File( 'inputs/design.spef.gz' )
  - >-
    assert '{activity_source}' == 'saif' or File( 'inputs/run.vcd' )
  - >-
    assert '{activity_source}' != 'saif' or File( 'inputs/run.saif' )
  - >-
    assert '{activity_source}' != 'rtl_vcd' or File( 'inputs/design.namemap' )
  - >-
    assert '{saif_instance}' != 'auto' or File( 'inputs/testbench-contract.json' )

postconditions:
  - assert File( 'outputs/primetime.session' )
  - assert File( 'outputs/design.sdf' )
  - assert File( 'outputs/power-reports' )
  - assert File( 'outputs/power.rpt' )
  - assert File( 'outputs/activity.rpt' )
  - assert File( 'outputs/activity-source.json' )
