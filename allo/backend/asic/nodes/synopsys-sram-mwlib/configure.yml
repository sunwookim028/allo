#=========================================================================
# Synopsys SRAM Milkyway Library Generation
#=========================================================================
# Adds Synopsys Milkyway physical-reference libraries to generated SRAMs.
#
# This node intentionally sits after the open-source OpenRAM SRAM generation
# node so that Synopsys-specific Milkyway handling stays commercial-flow-only.
#

name: synopsys-sram-mwlib

inputs:
  - adk
  - srams

outputs:
  - srams

commands:
  - bash run.sh

parameters:
  mwlib_tool: auto
  mwlib_tech_file: rtk-tech.tf

preconditions:
  - assert File( 'inputs/adk' )
  - assert File( 'inputs/srams' )

postconditions:
  - assert File( 'outputs/srams' )

