name: allo-asic-compilation

inputs: []

outputs:
  - allo-build
  - asic-debug
  - backend-rtl
  - asic-manifest.json
  - asic-manifest.tcl
  - asic-manifest-final.json
  - asic-manifest-final.tcl
  - build-metadata.json
  - allo-build.log
  - build-success

commands:
  - bash run.sh

parameters:
  construct_path: undefined
  allo_design_file: undefined
  allo_entrypoint: build
  backend: vitis
  build_mode: csyn
  clock_period: 10.0
  backend_options: '{"device":"u280"}'
  python_bin: python

preconditions:
  - assert Tool( '{python_bin}' )
  - assert '{build_mode}' == 'csyn'
  - |
    backend = '{backend}'
    if backend == 'vitis':
      assert Tool( 'vitis_hls' )
    else:
      raise AssertionError('unsupported Allo backend: ' + backend)
  - |
    from pathlib import Path
    design = Path('{allo_design_file}')
    if not design.is_absolute():
      design = Path('{construct_path}').resolve().parent / design
    assert design.is_file(), str(design)
  - |
    import subprocess
    result = subprocess.run(
      ['{python_bin}', '-c', 'import allo'],
      stdout=subprocess.PIPE,
      stderr=subprocess.PIPE,
      text=True,
    )
    assert result.returncode == 0, result.stderr

postconditions:
  - assert File( 'outputs/build-success' )
  - assert File( 'outputs/allo-build' )
  - assert File( 'outputs/asic-debug' )
  - assert File( 'outputs/backend-rtl' )
  - assert File( 'outputs/asic-manifest.json' )
  - assert File( 'outputs/asic-manifest.tcl' )
  - assert File( 'outputs/asic-manifest-final.json' )
  - assert File( 'outputs/asic-manifest-final.tcl' )
  - assert File( 'outputs/build-metadata.json' )
  - assert File( 'outputs/allo-build.log' )
  - assert 'traceback' not in File( 'outputs/allo-build.log' )
  - assert 'post_hls_enriched' in File( 'outputs/asic-manifest-final.json' )
